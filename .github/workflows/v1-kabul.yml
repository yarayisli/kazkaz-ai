name: V1 Kabul Kapısı

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: API bağımlılıkları
        run: pip install -r requirements-api.txt httpx

      - name: API, finans ve güvenlik testleri
        run: python -m unittest discover -s api/tests -v

      - name: Motor bağımlılıkları (test_engines forecast fallback)
        # statsmodels: Prophet olmadığında ExponentialSmoothing devreye giriyor;
        # kök testleri (test_engines.py) Prophet eksikliğini fallback ile geçirir.
        # Not: Bash'de `>` redirection olmasın diye specifier tırnak içinde.
        run: pip install 'statsmodels>=0.14.0'

      - name: Kök motor ve usage tracker testleri
        # test_engines.py: financial, cashflow, debt, budget, forecast,
        # investment, customer, sector, cac/ltv motorları (111 test).
        # test_usage_tracker.py: admin dashboard event counters (10 test).
        run: python -m unittest test_engines test_usage_tracker -v

      - name: Python sözdizimi
        run: python -m compileall -q api cfo_agent.py gemini_engine.py

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web bağımlılıkları
        run: npm ci --prefix web

      - name: Web tip kontrolü ve üretim derlemesi
        run: |
          npm --prefix web run lint
          npm --prefix web run build

      - name: Playwright Chromium kurulumu
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Masaüstü ve mobil tarayıcı kabul testleri
        working-directory: web
        env:
          # Landing sayfası testleri gerçek Firebase'e erişmiyor; ancak
          # web/src/lib/firebase.ts eksik VITE_FIREBASE_* değerlerinde
          # modül seviyesinde throw ediyor ve React uygulaması hiç mount
          # olmuyor. E2E'de landing yakalayabilmek için CI-özel placeholder
          # değerler enjekte ediliyor. Bunlar gerçek anahtar değil; canlı
          # Firebase servisleriyle asla iletişim kurmaz (Playwright zaten
          # /api/** çağrılarını page.route ile stub'lıyor).
          VITE_FIREBASE_PROJECT_ID: kazkaz-e2e
          VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          VITE_FIREBASE_API_KEY: e2e-placeholder-not-a-real-key
          VITE_FIREBASE_AUTH_DOMAIN: kazkaz-e2e.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: kazkaz-e2e.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
        run: npm run test:e2e

      - name: Üretim bağımlılığı güvenlik taraması
        run: npm --prefix web audit --omit=dev --audit-level=high

      - name: Docker üretim imajı
        run: docker build --tag kazkaz-ai-v1:ci .

      - name: Depoda gizli anahtar taraması
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E -i '(^|/)(\.env|.*firebase-adminsdk.*\.json|firebase-key\.json|.*service-account.*\.json|.*\.pem|.*\.key)$'; then
            echo "Gizli değer taşıyabilecek dosya Git tarafından izleniyor." >&2
            exit 1
          fi
          if grep -RIlE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=tests \
            --exclude='.env' --exclude='.env.*' \
            '(nvapi-[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .; then
            echo "Olası gerçek gizli anahtar bulundu." >&2
            exit 1
          fi
